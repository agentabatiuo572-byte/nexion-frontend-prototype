<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UVEL · 完整演示原型</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:#e9ecef;color:#182127;font:14px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid #d9dee2}strong{font-size:16px}small{display:block;color:#69747c;font-size:12px}nav{display:flex;flex-wrap:wrap;gap:6px}button,select{font:inherit;border:1px solid #d7dce0;background:#fff;border-radius:12px;padding:7px 10px;color:inherit;cursor:pointer}button:hover{background:#f1f4e5}button:focus-visible,select:focus-visible{outline:2px solid #527900;outline-offset:2px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:0;gap:20px;padding:20px}.stage{display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden}.phone-fit{position:relative;width:calc(390px * var(--phone-scale,0));height:calc(844px * var(--phone-scale,0))}iframe{position:absolute;inset:0 auto auto 0;width:390px;height:844px;max-width:none;border:0;border-radius:28px;background:#000;box-shadow:0 18px 60px #121c3030;transform:scale(var(--phone-scale,0));transform-origin:top left}.panel{align-self:start;max-height:100%;overflow:auto;border:1px solid #dde2e5;background:#fff;border-radius:18px;padding:18px}.panel h2{font-size:15px;margin:0 0 6px}.panel p{font-size:12px;color:#69747c;margin:0 0 16px}.field{display:block;margin-bottom:14px}.field>span{display:block;font-size:12px;color:#69747c;margin-bottom:5px}.field select{width:100%;font-size:13px}.toggle{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px}.reset{width:100%;margin-top:10px}.note{font-size:12px;color:#69747c;padding-top:12px}footer{text-align:center;color:#69747c;font-size:12px;padding:0 12px 10px}@media(max-width:700px){header{padding:10px;flex-wrap:wrap}.workspace{grid-template-columns:minmax(0,1fr) 190px;gap:8px;padding:8px}.panel{padding:12px}.panel p{display:none}nav{gap:4px}button,select{padding:5px 8px}}@media(max-width:480px){.workspace{display:flex;flex-direction:column}.stage{flex:1}.panel{width:100%;max-height:150px;order:-1}.panel-fields{display:flex;gap:8px;flex-wrap:wrap}.field{width:calc(50% - 4px);margin-bottom:0}.toggle,.note,.reset{display:none}.panel h2{margin-bottom:8px}}
</style></head><body>
<header><div><strong>UVEL · 完整演示原型</strong><small>模拟数据 · 390 × 844 · 不连接真实服务</small></div><nav aria-label="预览控制">
<select id="page" aria-label="页面"><optgroup label="主要界面"><option value="index/index">首页</option><option value="earn/earn">赚取</option><option value="store/store">商城</option><option value="team/team">团队</option><option value="me/me">我的</option></optgroup><optgroup label="任务与活动"><option value="missions/missions">任务中心</option><option value="events/events">购机活动</option><option value="events/events?source=legacy">互动活动</option><option value="events/genesis-raffle">创世抽奖</option><option value="events/promotion-rewards">活动奖励（全部状态）</option><option value="daily/daily">签到</option><option value="me/achievements">成就</option><option value="learn/courses">课程</option></optgroup><optgroup label="更多界面"><option value="genesis/genesis">创世节点 · 即将上线</option><option value="me/devices">我的设备</option><option value="store/orders">订单</option><option value="me/wallet">钱包</option><option value="me/wallet-bills">账单</option><option value="me/rewards">我的奖励</option><option value="team/rank">等级</option><option value="team/commissions">奖励明细</option><option value="team/leaderboard">排行榜</option><option value="team/leadership-pool">团队激励池</option><option value="me/notifications?section=notifications">消息</option><option value="trust/trust">信任中心</option><option value="me/security">账户安全</option><option value="me/profile">个人资料</option><option value="me/goals">收益目标</option><option value="me/receipts">收益凭证</option><option value="me/wallet-cards">银行卡</option><option value="me/preferences">偏好设置</option></optgroup></select>
<button id="theme">切换明暗</button><select id="locale" aria-label="预览语言"><option value="zh">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></nav></header>
<div class="workspace"><main class="stage"><div class="phone-fit"><iframe id="phone" title="UVEL 手机交互原型" src="/?nx_device=off#/pages/index/index"></iframe></div></main><aside class="panel" aria-label="演示状态"><h2>演示状态</h2><p>选择场景后立即刷新手机界面。此面板仅用于原型演示。</p><div class="panel-fields" id="fields"></div><label class="toggle"><input id="highestRank" type="checkbox">最高等级 V8</label><label class="toggle"><input id="allCoursesDone" type="checkbox">全部课程已完成</label><button class="reset" id="reset">重置完整演示</button><div class="note" id="status" role="status">正在准备演示数据…</div></aside></div>
<footer>手机内可滚动、点击与返回 · 商品参数、金额、人物和奖励均为演示样例</footer>
<script>
const frame=document.getElementById('phone'),stage=document.querySelector('.stage'),fit=document.querySelector('.phone-fit');
function fitPhone(){const scale=Math.max(0,Math.min(1,stage.clientWidth/390,stage.clientHeight/844));fit.style.setProperty('--phone-scale',scale)}new ResizeObserver(fitPhone).observe(stage);fitPhone();
const page=document.getElementById('page'),status=document.getElementById('status');page.onchange=()=>frame.src='/?nx_device=off#/pages/'+page.value;
frame.onload=()=>{try{const route=frame.contentWindow.location.hash.replace(/^#\/pages\//,'');if([...page.options].some(option=>option.value===route))page.value=route}catch{}};
document.getElementById('theme').onclick=()=>{const saved=JSON.parse(localStorage.getItem('nexgrid-theme-v1')||'{}');localStorage.setItem('nexgrid-theme-v1',JSON.stringify({type:'object',data:{mode:saved.data?.mode==='dark'?'light':'dark'}}));frame.contentWindow.location.reload()};
const language=document.getElementById('locale');language.value=JSON.parse(localStorage.getItem('nexgrid-locale-v1')||'{}').data?.code||'zh';language.onchange=async()=>{localStorage.setItem('nexgrid-locale-v1',JSON.stringify({type:'object',data:{code:language.value,userSet:true}}));await fetch('/preview-language?code='+language.value);frame.contentWindow.location.reload()};
const labels={catalogState:'商城商品',taskState:'新手 / 每周任务',eventState:'活动',benefitState:'代金券 / 试用',dataState:'数据状态',streakState:'连续签到',ambassadorState:'区域合作申请'};
async function update(changes){status.textContent='正在切换…';const result=await fetch('/__demo/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(changes)}).then(response=>response.json());render(result);frame.contentWindow.location.reload();status.textContent='场景已更新 · 所有操作均为模拟'}
function render({state,options}){document.getElementById('fields').replaceChildren(...Object.entries(options).map(([key,values])=>{const label=document.createElement('label');label.className='field';const title=document.createElement('span');title.textContent=labels[key];const select=document.createElement('select');select.id=key;select.setAttribute('aria-label',labels[key]);for(const[value,text]of values){const option=document.createElement('option');option.value=value;option.textContent=text;select.append(option)}select.value=state[key];select.onchange=()=>update({[key]:select.value});label.append(title,select);return label}));document.getElementById('highestRank').checked=state.highestRank;document.getElementById('allCoursesDone').checked=state.completed.length===3}
for(const key of ['highestRank','allCoursesDone'])document.getElementById(key).onchange=event=>update({[key]:event.target.checked});document.getElementById('reset').onclick=()=>update({reset:true});fetch('/__demo/state').then(response=>response.json()).then(data=>{render(data);status.textContent='完整目录与任务活动已载入'}).catch(()=>{status.textContent='演示服务未连接，请刷新页面'});
</script></body></html>
