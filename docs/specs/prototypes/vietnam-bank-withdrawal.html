<title>越南银行卡提现 · 交互设计稿</title>
<style>
:root{--v5-bg:#000000;--v5-surface:#141414;--v5-surface-2:#1F1F1F;--v5-border:rgba(255,255,255,.06);--v5-border-strong:rgba(255,255,255,.18);--v5-ink:#F5F7FA;--v5-ink-2:#D1D5DB;--v5-ink-3:#9BA3B5;--v5-brand:#9EDC1D;--v5-on-brand:#0A0A0A;--v5-warning:#FFCB4D;--v5-danger:#FF5C5C;--font-v5:"General Sans","Manrope","Microsoft YaHei","Segoe UI",sans-serif}

*{box-sizing:border-box}
body{margin:0;background:var(--v5-bg);color:var(--v5-ink);font:500 14px/1.6 var(--font-v5)}
button,input,select{font:inherit}
button,input,select{min-height:44px}
button{border:0;border-radius:999px;background:var(--v5-surface-2);color:var(--v5-ink);padding:12px 20px;cursor:pointer;font-weight:600;transition:opacity .15s,transform .15s}
button:hover:not(:disabled){opacity:.88}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--v5-brand);outline-offset:4px}
h1:focus{outline:none}
input,select{width:100%;min-width:0;border:1px solid var(--v5-border-strong);border-radius:12px;background:var(--v5-bg);color:var(--v5-ink);padding:12px}
label{display:block;margin:18px 0 6px;font-size:12.5px;color:var(--v5-ink-2)}
h1,h2,p{margin:0}
h1{font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.5px}
h2{font-size:20px;line-height:1.4;font-weight:600}
small,.muted{color:var(--v5-ink-3)}
small{display:block;font-size:12.5px}
.workspace{max-width:1020px;margin:auto;padding:32px 24px 48px}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}
.eyebrow{color:var(--v5-brand);font-size:11.5px;letter-spacing:1px;margin-bottom:8px}
.draft-note{max-width:480px;margin-top:8px;font-size:12.5px;color:var(--v5-warning)}
.layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,440px);justify-content:space-between;gap:40px}
.panel{align-self:start}
.panel p{font-size:12.5px;color:var(--v5-ink-3);margin-top:14px}
.panel label:first-child{margin-top:0}
.panel .reset{width:100%;margin-top:18px}
.panel hr{border:0;border-top:1px solid var(--v5-border-strong);margin:24px 0}
.app{min-width:0;background:var(--v5-surface);border:1px solid var(--v5-border-strong);border-radius:28px;min-height:690px;overflow:hidden}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--v5-border)}
.appbar span{font-size:12.5px;color:var(--v5-ink-3)}
.back{padding:6px 12px;min-width:44px;font-size:20px;background:transparent}
.screen{padding:24px}
.intro{margin:10px 0 24px;color:var(--v5-ink-3);font-size:13.5px}
.balance{font-size:48px;font-weight:600;line-height:1.2;letter-spacing:-2px;margin:8px 0 20px;font-variant-numeric:tabular-nums}
.balance span{font-size:15px;letter-spacing:0;color:var(--v5-ink-3);margin-left:8px}
.primary{background:var(--v5-brand);color:var(--v5-on-brand);width:100%;min-height:50px;margin-top:24px}
.secondary{width:100%;margin-top:12px}
.choice{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:18px 20px;margin-top:14px}
.choice strong{display:block;font-size:15px;font-weight:600}
.choice small{font-weight:400}
.choice .arrow{font-size:20px;color:var(--v5-brand)}
.block{border-radius:16px;background:var(--v5-surface-2);padding:18px;margin:20px 0}
.chip{display:inline-block;border-radius:999px;background:var(--v5-surface-2);color:var(--v5-brand);padding:4px 10px;font-size:11.5px;margin-bottom:14px}
.notice{border-left:2px solid var(--v5-warning);padding:0 0 0 12px;color:var(--v5-ink-2);font-size:12.5px;margin:20px 0}
.warn{color:var(--v5-warning)}
.error{color:var(--v5-danger);font-size:12.5px;margin-top:8px;min-height:20px}
.block p{overflow-wrap:anywhere}
.account{font-size:20px;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:6px 0}
.rows{margin:20px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--v5-border)}
.row dt{color:var(--v5-ink-3);font-size:12.5px}
.row dd{margin:0;text-align:right;font-size:13.5px;max-width:65%;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.money{font-size:30px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.money span{display:block;font-size:12.5px;color:var(--v5-ink-3);font-weight:400;margin-top:8px}
.amount-wrap{position:relative}
.amount-wrap input{font-size:26px;padding-right:88px}
.amount-wrap button{position:absolute;right:5px;top:5px;padding:8px 14px;background:transparent;color:var(--v5-brand)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
.check input{width:20px;min-width:20px;min-height:20px;accent-color:var(--v5-brand);margin-top:2px}
.status-mark{width:52px;height:52px;display:grid;place-items:center;background:var(--v5-surface-2);color:var(--v5-brand);border-radius:50%;font-size:26px;margin-bottom:22px}
.skeleton{height:52px;border-radius:12px;background:var(--v5-surface-2);margin:16px 0;animation:pulse 1s ease-in-out infinite alternate}
.skeleton.short{width:65%;height:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.brand{font-size:15px;font-weight:600;letter-spacing:.4px}
.caption{margin-top:16px;font-size:11.5px;color:var(--v5-ink-3);text-align:center}

@keyframes pulse{to{opacity:.45}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
}
@media(max-width:720px){.workspace{padding:20px 16px 32px}
.masthead{margin-bottom:20px}
.masthead .brand{display:none}
.layout{grid-template-columns:minmax(0,1fr);gap:24px}
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.panel label{margin:0 0 6px}
.panel .reset{margin-top:0}
.panel .wide{grid-column:1/-1}
.panel hr,.panel p.scope{display:none}
.panel p{margin:0}
.app{border-radius:24px;min-height:650px}
.screen{padding:24px 20px}
.panel select{font-size:12.5px;padding:10px}
.row{gap:10px}
}

</style>

</div>

let lang='zh', scenario='available', step='wallet', outcome='review', amount='100', account='001234567890', holder='NGUYEN VAN A', order=null, quote=null, busy='', generation=0;
const t=key=>copy[lang][key], scenarios=['available','unbound','credit','unknown','cooldown','maintenance','rejected','pending'], outcomes=['review','processing','uncertain','paid','refunded'];
const fmt=(n,d=6)=>new Intl.NumberFormat(lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:d}).format(n);
const rows=items=>`<dl class="rows">${items.map(([key,value])=>`<div class="row"><dt>${t(key)}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
const button=(action,label,kind='primary',disabled=false)=>`<button type="button" class="${kind}" data-action="${action}" ${disabled?'disabled':''}>${t(label)}</button>`;
const title=(key,note)=>`<h1 tabindex="-1">${t(key)}</h1>${note?`<p class="intro">${t(note)}</p>`:''}`;
const accountCard=()=>`<div class="block"><small>${t('recipient')}</small><p class="account">•••• ${esc(account.slice(-4))}</p><p>${esc(holder)}</p></div>`;
const feeRows=q=>rows([['total',`${fmt(q.total/1e6)} USDT`],['fee',`${fmt(q.fee/1e6)} USDT · 2%`],['net',`${fmt(q.net/1e6)} USDT`],['rate',`1 USDT = ${fmt(25000)} VND`]]);
function announce(message){$('announce').textContent=message;}
function goto(next){step=next;render();$('screen').querySelector('h1')?.focus();}
function run(message,next){const token=++generation;busy=message;render();announce(t(message));setTimeout(()=>{if(token!==generation)return;busy='';next();render();$('screen').querySelector('h1')?.focus();},650);}
function reset(next='wallet'){generation++;busy='';step=next;outcome='review';amount='100';account='001234567890';holder='NGUYEN VAN A';order=null;quote=null;render();}
function showError(message,field){$('error').textContent=t(message);if(field){$(field).setAttribute('aria-invalid','true');$(field).focus();}announce(t(message));}
function seconds(){return quote?Math.max(0,Math.ceil((quote.expires-Date.now())/1000)):0;}
function tick(){if(step!=='confirm'||busy)return;const remaining=seconds();if($('countdown'))$('countdown').textContent=remaining?`${remaining} ${t('seconds')}`:t('expired');if($('submit'))$('submit').disabled=!remaining;if($('requote'))$('requote').hidden=remaining>0;}
function render(){
  document.documentElement.lang=lang==='vi'?'vi':'zh-CN';document.title=`${t('title')} · NexGrid`;
  for(const [id,key] of Object.entries({'draft-title':'title','draft-note':'draft','language-label':'language','scenario-label':'scenario','outcome-label':'outcome','reset':'reset','expire':'expire','control-note':'controls','scope-note':'scope','caption':'caption'}))$(id).textContent=t(key);
  $('scenario').innerHTML=scenarios.map(s=>`<option value="${s}" ${s===scenario?'selected':''}>${t(s)}</option>`).join('');$('outcome').innerHTML=outcomes.map(s=>`<option value="${s}" ${s===outcome?'selected':''}>${t(s)}</option>`).join('');$('outcome').disabled=!order;$('expire').hidden=step!=='confirm'||!!busy;
  $('back').setAttribute('aria-label',t('back'));$('back').disabled=step==='wallet'||!!busy;$('step-label').textContent=t(({wallet:'wallet',method:'withdraw',crypto:'crypto',bank:'bank',bind:'recipient',amount:'bank',confirm:'confirm',result:'bank'})[step]);$('screen').setAttribute('aria-busy',String(!!busy));
  let html='';
  if(busy)html=title(busy)+`<div aria-hidden="true"><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div></div><p class="intro">${t('loading')}</p>`;
  else if(step==='wallet'){const balance=order&&outcome!=='refunded'?100-order.total/1e6:100;html=title('wallet')+`<div class="block"><small>${t('availableBalance')}</small><p class="balance">${fmt(balance)}<span>USDT</span></p><small>${t('walletNote')}</small></div>`+button(order?'view':'withdraw',order?'viewOrder':'withdraw')+(order?`<p class="intro">${t('orderHint')}</p>`:'');}
  else if(step==='method')html=title('method','methodNote')+`<button class="choice" data-action="crypto"><span><strong>${t('crypto')}</strong><small>${t('cryptoSub')}</small></span><span class="arrow" aria-hidden="true">↗</span></button><button class="choice" data-action="bank"><span><strong>${t('bank')}</strong><small>${t('bankSub')}</small></span><span class="arrow" aria-hidden="true">↗</span></button>`;
  else if(step==='crypto')html=title('crypto','cryptoNote')+button('method','cryptoReturn');
  else if(step==='bank'){
    html=title('recipient')+`<p class="intro">${t('bankSub')}</p><span class="chip ${scenario==='available'?'':'warn'}">${t(scenario)}</span>`;
    if(!['unbound','maintenance'].includes(scenario))html+=accountCard();
    html+=`<p class="notice">${t(({available:'boundNote',unbound:'unboundNote',credit:'creditNote',unknown:'unknownNote',cooldown:'cooldownNote',maintenance:'maintenanceNote',rejected:'rejectedNote',pending:'pendingNote'})[scenario])}</p>`;
    if(['cooldown','pending'].includes(scenario))html+=rows([['validation',t(scenario==='cooldown'?'verified':'pending')],['waiting',t('waitingValue')]]);
    if(scenario==='available')html+=button('amount','continue');
    else if(scenario==='unbound')html+=button('bind','bind');
    else if(['credit','rejected'].includes(scenario))html+=button('bind',scenario==='credit'?'replace':'edit');
    else if(['unknown','pending','cooldown'].includes(scenario))html+=button('check','checkAgain')+button('amount','continue','secondary',true);
    else html+=button('method','cryptoReturn');
  }
  else if(step==='bind')html=title('bind')+`<form id="bind-form" novalidate><label for="account">${t('accountLabel')}</label><input id="account" inputmode="numeric" autocomplete="off" maxlength="32" value="${esc(account)}" aria-describedby="account-help error"><small id="account-help">${t('accountHelp')}</small><label for="holder">${t('holder')}</label><input id="holder" autocomplete="off" maxlength="100" value="${esc(holder)}" aria-describedby="holder-help error"><small id="holder-help">${t('holderHelp')}</small><p class="error" id="error" role="alert"></p><small>${t('pendingNote')}</small><button type="submit" class="primary">${t('save')}</button></form>`;
  else if(step==='amount')html=title('amount','amountNote')+accountCard()+`<form id="amount-form" novalidate><label for="amount">${t('total')} · USDT</label><div class="amount-wrap"><input id="amount" inputmode="decimal" value="${esc(amount)}" autocomplete="off" aria-describedby="range error"><button type="button" data-action="all">${t('all')}</button></div><small id="range">${t('range')}</small><p class="error" id="error" role="alert"></p><p class="notice">${t('feeNote')}</p><button type="submit" class="primary">${t('quote')}</button></form>`;
  else if(step==='confirm')html=title('confirm','confirmNote')+accountCard()+`<div class="block"><small>${t('receive')}</small><p class="money">${fmt(quote.vnd,0)}<span>VND</span></p></div>`+feeRows(quote)+rows([['deadline','<span id="countdown"></span>']])+`<small>${t('expiryHelp')}</small><p class="notice">${t('feeNote')}</p><label class="check"><input type="checkbox" id="consent"><span>${t('consent')}</span></label><p class="error" id="error" role="alert"></p><button type="button" class="primary" data-action="submit" id="submit">${t('submit')}</button><button type="button" class="primary" data-action="requote" id="requote" hidden>${t('refreshQuote')}</button>`;
  else if(step==='result')html=`<div class="status-mark" aria-hidden="true">${outcome==='paid'?'✓':outcome==='refunded'?'↶':'⋯'}</div>`+title(outcome,`${outcome}Note`)+`<div class="block"><small>${t('receive')}</small><p class="money">${fmt(order.vnd,0)}<span>VND</span></p></div>`+rows([['order','DESIGN-WD-001'],['recipient',`•••• ${esc(order.account.slice(-4))}`],['holder',esc(order.holder)],[outcome==='refunded'?'returned':outcome==='paid'?'deducted':'frozen',`${fmt(order.total/1e6)} USDT`]])+button('query','query')+button('wallet','walletReturn','secondary');
  $('screen').innerHTML=html;tick();
  $('bind-form')?.addEventListener('submit',event=>{event.preventDefault();const a=$('account').value.trim(),h=$('holder').value.trim();if(!/^\d{6,32}$/.test(a)){showError('accountError','account');return;}if([...h].length<2||[...h].length>100){showError('holderError','holder');return;}account=a;holder=h;run('checking',()=>{scenario='pending';step='bank';announce(t('saved'));});});
  $('amount-form')?.addEventListener('submit',event=>{event.preventDefault();amount=$('amount').value.trim();const decimal=lang==='vi'?amount.replace(',','.'):amount;if(!/^\d+(?:\.\d{1,6})?$/.test(decimal)||Number(decimal)<20||Number(decimal)>100){showError('amountError','amount');return;}if(scenario!=='available'||order)return;const total=Math.round(Number(decimal)*1e6),fee=Math.ceil(total*2/100);run('quoting',()=>{quote={total,fee,net:total-fee,vnd:Math.floor((total-fee)*25000/1e6),expires:Date.now()+60000};step='confirm';});});
  $('amount')?.addEventListener('input',event=>{amount=event.target.value;event.target.removeAttribute('aria-invalid');});
  for(const id of ['account','holder'])$(id)?.addEventListener('input',event=>event.target.removeAttribute('aria-invalid'));
}
$('screen').addEventListener('click',event=>{
  const action=event.target.closest('button[data-action]')?.dataset.action;if(!action||busy)return;
  if(action==='withdraw')goto(order?'result':'method');else if(action==='view')goto('result');else if(['wallet','method','crypto'].includes(action))goto(action);
  else if(action==='bank')goto(order?'result':'bank');else if(action==='bind'){if(scenario==='unbound'){account='';holder='';}goto('bind');}else if(action==='amount'&&scenario==='available'&&!order)goto('amount');
  else if(action==='all'){$('amount').value=amount='100';$('amount').removeAttribute('aria-invalid');$('error').textContent='';$('amount').focus();}
  else if(action==='check')run('checking',()=>announce(t(scenario==='unknown'?'stillUnknown':'stillWaiting')));
  else if(action==='requote'){quote=null;goto('amount');}
  else if(action==='submit'){
    if(order||scenario!=='available')return;if(!seconds()){showError('quoteExpired');tick();return;}if(!$('consent').checked){showError('consentError','consent');return;}
    run('submitting',()=>{order={...quote,account,holder};outcome='review';step='result';});
  }else if(action==='query')run('querying',()=>announce(t('querySame')));
});
$('back').addEventListener('click',()=>{if(busy)return;if(step==='confirm'){quote=null;goto('amount');}else goto(({method:'wallet',crypto:'method',bank:'method',bind:'bank',amount:'bank',result:'wallet'})[step]||'wallet');});
$('language').addEventListener('change',event=>{if(step==='bind'&&!busy) {account=$('account').value;holder=$('holder').value;}lang=event.target.value;render();});
$('scenario').addEventListener('change',event=>{scenario=event.target.value;reset('bank');});
$('outcome').addEventListener('change',event=>{if(!order)return;generation++;busy='';outcome=event.target.value;goto('result');announce(t(outcome));});
$('reset').addEventListener('click',()=>{scenario='available';reset();});
$('expire').addEventListener('click',()=>{if(quote){quote.expires=0;tick();announce(t('expired'));}});
setInterval(tick,1000);render();
</script>
</html>
